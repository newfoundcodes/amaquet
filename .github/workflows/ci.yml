name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/amaquet ./cmd/amaquet-cli ./cmd/amaquet-keygen ./cmd/amaquet-restore
      - name: Per-type Bash contracts
        run: ./tests/bash/run_all.sh
      - name: Type fuzz smoke
        run: AMAQUET_FUZZ_ITERATIONS=1 ./tests/bash/run_fuzz.sh
      - name: Protocol fuzz smoke
        run: AMAQUET_FRAME_FUZZ_ITERATIONS=50 ./tests/bash/run_protocol_fuzz.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 docs/scripts/check_docs.py
      - run: npm ci --no-audit --no-fund
        working-directory: docs
      - run: npm run build
        working-directory: docs

  fuzz-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Full fuzz smoke
        env:
          AMAQUET_SCENARIO_ITERATIONS: '1'
          AMAQUET_SCENARIO_SMOKE: '1'
          AMAQUET_TEST_JOBS: '2'
          AMAQUET_CONCURRENCY: '2'
          AMAQUET_FUZZ_ITERATIONS: '1'
          AMAQUET_FRAME_FUZZ_ITERATIONS: '50'
          AMAQUET_FUZZ_SEED: '4242'
          AMAQUET_GO_FUZZ_TIME: 1s
        run: make fuzz-all

  chaos-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/amaquet ./cmd/amaquet
          go build -o bin/amaquet-cli ./cmd/amaquet-cli
      - name: Bounded chaos smoke
        run: AMAQUET_SOAK_SECONDS=2 AMAQUET_SOAK_KEYS=16 AMAQUET_CHURN_CONNECTIONS=24 AMAQUET_CHURN_PARALLEL=4 AMAQUET_TTL_CHURN=50 AMAQUET_RESTART_ITERATIONS=2 AMAQUET_MEMORY_WRITES=80 ./tests/bash/run_chaos.sh
      - name: Benchmark smoke
        run: AMAQUET_BENCH_TIME=100ms ./scripts/run_benchmarks.sh
