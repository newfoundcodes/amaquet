name: Nightly Soak and Chaos
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Long chaos and soak suite
        env:
          AMAQUET_SOAK_SECONDS: '120'
          AMAQUET_SOAK_KEYS: '1024'
          AMAQUET_CHURN_CONNECTIONS: '2000'
          AMAQUET_CHURN_PARALLEL: '32'
          AMAQUET_TTL_CHURN: '10000'
          AMAQUET_RESTART_ITERATIONS: '25'
          AMAQUET_MEMORY_WRITES: '2000'
        run: make chaos
      - name: Native Go fuzzing
        env:
          AMAQUET_GO_FUZZ_TIME: '30s'
        run: make fuzz-all
      - name: Benchmarks
        run: make benchmark
